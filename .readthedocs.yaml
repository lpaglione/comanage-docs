# Read The Docs configuration for the COmanage Registry User Guide.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# When a Match User Guide is added, create a second RTD project in the
# RTD interface pointing to match/conf.py, with its own .readthedocs.yaml
# or by specifying the conf.py path in the RTD project settings.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: registry/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: registry/requirements.txt
